<div id="desktop">
    <div class="window" id="welcomeWindow" style="width: 300px; top: 100px; left: 100px; position: absolute;">
        <div class="title-bar"><div class="title-bar-text">Bem-vindo</div></div>
        <div class="window-body">
            <p>Olá, visitante! Este é o HomeLab de:</p>
            <h2 style="text-align: center; color: #000080;">Pedro Ribeiro</h2>
        </div>
    </div>

    <div class="desktop-icon" onclick="alert('Sistema: Ubuntu 26.04 LTS')">
        <i class="fa fa-desktop" style="color: #fff; background: #000080; padding: 10px; border: 1px solid #fff;"></i>
        Meu Comp.
    </div>
    
    <div class="desktop-icon" ondblclick="document.getElementById('devopsWindow').style.display = 'block'">
        <i class="fa fa-wrench" style="color: #fff; background: #000080; padding: 10px; border: 1px solid #fff;"></i>
        DevOps_Tools
    </div>

    <div class="window" id="devopsWindow" style="display: none; width: 550px; position: absolute; top: 150px; left: 200px; z-index: 10;">
        <div class="title-bar">
            <div class="title-bar-text">🔧 DevOps_Tools.exe - Painel de Controle</div>
            <div class="title-bar-controls">
                <button aria-label="Close" onclick="document.getElementById('devopsWindow').style.display = 'none'"></button>
            </div>
        </div>
        <div class="window-body">
            <p><strong>Configuração atual:</strong> Servidor Casa/Ubuntu</p>
            <div class="excuse-box" id="excuseDisplay">Clique no botão abaixo para um diagnóstico:</div>
            <section class="field-row" style="justify-content: flex-end;">
                <button onclick="generateExcuse()">Gerar Diagnóstico</button>
            </section>
        </div>
    </div>
</div>

<div class="taskbar">
    <div class="start-button">
        <img src="https://upload.wikimedia.org/wikipedia/pt/2/29/Windows_logo_1995.png" alt="Win">
        <strong>Iniciar</strong>
    </div>
    <div class="tray">
        <i class="fa fa-user"></i> <span>Pedro Ribeiro</span>
        <span id="clock" style="border-left: 1px solid #808080; padding-left: 10px; margin-left: 10px;">00:00:00</span>
    </div>
</div>
