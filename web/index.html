<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Portfólio DevOps - Windows 98</title>
    <link rel="stylesheet" href="https://unpkg.com/7.css">
    <style>
        body {
            background-color: #008080;
            padding: 30px;
            font-family: "MS Sans Serif", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
            margin: 0;
        }
        .window {
            width: 550px;
        }
        .window-body {
            margin: 4px;
        }
        .excuse-box {
            background: #fff;
            border: 2px inset #d2d2d2;
            padding: 20px;
            margin: 15px 0;
            min-height: 50px;
            font-weight: bold;
            color: #000;
            font-size: 14px;
            display: flex;
            align-items: center;
        }
        /* Estilo para a barra de menus clássica */
        .menu-bar {
            display: flex;
            background: #c0c0c0;
            padding: 2px 6px;
            gap: 12px;
            border-bottom: 1px solid #808080;
        }
        .menu-item {
            cursor: pointer;
            font-size: 12px;
            color: #000;
        }
        .menu-item:hover {
            background: #000080;
            color: #fff;
        }
    </style>
</head>
<body>

<div class="window">
    <div class="title-bar">
        <div class="title-bar-text">🔧 DevOps_Tools.exe - Painel de Controle</div>
        <div class="title-bar-controls">
            <button aria-label="Minimize"></button>
            <button aria-label="Maximize"></button>
            <button aria-label="Close" onclick="alert('Deseja mesmo fechar o sistema?')"></button>
        </div>
    </div>

    <div class="menu-bar">
        <div class="menu-item" onclick="alert('Função de Salvar em breve!')"><u>A</u>rquivo</div>
        <div class="menu-item" onclick="alert('Limpar histórico acionado.')"><u>E</u>ditar</div>
        <div class="menu-item" onclick="alert('Homelab rodando em Ubuntu 26.04 + Docker!')"><u>A</u>juda</div>
    </div>

    <div class="window-body">
        <p style="margin-top: 10px;">⚡ <strong>Status do Lab:</strong> Operando em modo de Live Reload (Zero Downtime).</p>
        
        <div class="excuse-box" id="excuseDisplay">
            Pronto para diagnosticar o ambiente de produção...
        </div>

        <section class="field-row" style="justify-content: flex-end; gap: 6px;">
            <button onclick="generateExcuse()" style="font-weight: bold;">Gerar Nova Desculpa</button>
            <button onclick="alert('Sistema operando em segurança máxima.')">OK</button>
        </section>
    </div>

    <div class="status-bar">
        <p class="status-bar-field">Status: Online</p>
        <p class="status-bar-field" style="flex-grow: 2;">Containers: 1 Ativo</p>
        <p class="status-bar-field" id="clock" style="font-weight: bold; padding-right: 10px;">00:00:00</p>
    </div>
</div>

<script>
    // Gerador Dinâmico de Desculpas
    const excuses = [
        "Status 500: Foi culpa do DNS. Sempre é o DNS.",
        "Erro: O estagiário rodou o script na branch errada.",
        "Falha crítica: Não é um bug, é uma feature não documentada.",
        "Aviso: O Docker Hub estava fora do ar na hora do build.",
        "Conflito: Na minha máquina funciona perfeitamente.",
        "Timeout: Esse código foi escrito antes do primeiro café do dia."
    ];

    function generateExcuse() {
        const randomIndex = Math.floor(Math.random() * excuses.length);
        document.getElementById('excuseDisplay').innerText = excuses[randomIndex];
    }

    // Função do Relógio em Tempo Real
    function updateClock() {
        const now = new Date();
        const timeString = now.toLocaleTimeString('pt-BR');
        document.getElementById('clock').innerText = "🕒 " + timeString;
    }
    setInterval(updateClock, 1000);
    updateClock(); // Inicializa imediatamente
</script>

</body>
</html>
